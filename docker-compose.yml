services:
  ui:
    build:
      context: ./ui
      dockerfile: ./Dockerfile
      target: runtime-local
    networks:
      - app-network
    expose:
      - 80
    working_dir: /app
    volumes:
      - ./ui:/app
    environment:
      VITE_BACKEND_URL: ${HTTP_PROTOCOL}://${APP_URL}:${APP_PORT}/api
      VITE_API_URL: ${HTTP_PROTOCOL}://${APP_URL}:${APP_PORT}/api/api
      VITE_DEV_SERVER_PORT: 80
      VITE_DEV_SERVER_HOST: 0.0.0.0
      HOST_UID: ${HOST_UID}
      HOST_GID: ${HOST_GID}
    labels:
      traefik.enable: "true"
      traefik.http.routers.ui.rule: "Host(`${APP_URL}`)"
    command: ['sh', '-c', 'npm ci && npm run dev']

  api:
    build:
      context: ./api
      dockerfile: ./Dockerfile
      target: runtime-local
    networks:
      - app-network
    expose:
      - 80
    environment:
      APP_NAME: ${APP_NAME}
      APP_URL: ${HTTP_PROTOCOL}://${APP_URL}:${APP_PORT}/api
      UI_URL: ${HTTP_PROTOCOL}://${APP_URL}:${APP_PORT}
      SANCTUM_STATEFUL_DOMAINS: localhost,${APP_URL}:${APP_PORT}
      SESSION_DOMAIN: ${APP_URL}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      HOST_UID: ${HOST_UID}
      HOST_GID: ${HOST_GID}
    volumes:
      - ./api:/app
      - ./api/storage:/app/storage
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: "Host(`${APP_URL}`) && PathPrefix(`/api`)"
      traefik.http.middlewares.api-strip-prefix.stripprefix.prefixes: "/api"
      traefik.http.routers.api.middlewares: "api-strip-prefix"
    command: sh -c '
        composer install &&
        php artisan optimize:clear &&
        php artisan migrate --seed &&
        frankenphp run --config /etc/frankenphp/Caddyfile --adapter caddyfile
      '

  mailhog:
    image: mailhog/mailhog
    networks:
      - app-network
    expose:
      - 1025
      - 8025
    ports:
      - "8025:8025"

  reverse-proxy:
    image: traefik:3.5
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=app-network
      - --entrypoints.web.address=:9999
    ports:
      - "9999:9999"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-network
    depends_on:
      - ui
      - api

networks:
  app-network:
    driver: bridge
